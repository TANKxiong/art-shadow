name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install
      - run: npm run build

      - name: Package
        run: |
          npm install electron@31 electron-builder@25 --save-dev
          npx electron-builder --win=portable --config=electron-builder.json
      - uses: actions/upload-artifact@v4
        with:
          name: ArtShadow-Portable
          path: release/*.exe
