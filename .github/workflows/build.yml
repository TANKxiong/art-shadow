name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install
      - run: npm run build

      - name: Package with Electron
        run: |
          npm install electron@31 electron-builder --save-dev
          npx electron-builder --win portable ^
            --config.build.win.target=portable ^
            --config.build.productName="画影客" ^
            --config.build.appId=com.artshadow.app ^
            --config.directories.output=release ^
            --config.files='["dist/**/*","electron/**/*","node_modules/**/*","package.json"]'

      - uses: actions/upload-artifact@v4
        with:
          name: ArtShadow-Portable
          path: release/*.exe
